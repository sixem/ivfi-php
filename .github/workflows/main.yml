name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '20', '22', '24' ]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Setup PHP
        if: matrix.node-version == '24'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Install PHP test dependencies
        if: matrix.node-version == '24'
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP regression tests
        if: matrix.node-version == '24'
        run: composer test -- --testdox

      - name: Install release packaging tools
        if: matrix.node-version == '24'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full jq

      - name: Test release packaging
        if: matrix.node-version == '24'
        run: bash scripts/test-release.sh

      - name: Package release
        if: matrix.node-version == '24'
        run: pnpm run pack-release --from-build

      - name: Archive production artifacts
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build/
            ivfi-*.zip
