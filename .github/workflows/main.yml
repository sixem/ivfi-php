name: Build

on:
  push:
    # master is kept so the workflow still fires if these changes are
    # offered upstream, where that is the default branch
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is in maintenance, so the floor is the older of the two current LTS lines
        node: [ '24', '26' ]

    name: Build (Node ${{ matrix.node }})

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Build standalone
      run: npm run make-standalone

    - name: Archive production artifacts
      if: matrix.node == '26'
      uses: actions/upload-artifact@v5
      with:
        name: build
        path: build/

  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 13 needs 8.4 or newer. The script itself still runs on
        # older PHP; this is the floor for the test tooling, not the product
        php: [ '8.4', '8.5' ]

    name: PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none
        tools: composer

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '26'
        cache: npm

    # The suite runs against the built indexer.php, not the webpack template
    - name: Build the indexer
      run: |
        npm ci
        npm run build

    - name: Install PHP dependencies
      run: composer install --no-interaction --no-progress

    - name: Run the PHP test suite
      run: vendor/bin/phpunit
