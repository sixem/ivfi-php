services:
  indexer:
    image: nginx:1.30
    volumes:
      # Serve point (browsable directory)
      - ${SERVEPOINT}:/servePoint
      # Web root
      - ./public:/var/www/html
      # Nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - ${PORT}
    depends_on:
      - php
  php:
    image: php:8.5-fpm
    volumes:
      # Serve point (browsable directory)
      - ${SERVEPOINT}:/servePoint
      # Web root
      - ./public:/var/www/html
      # Indexer configuration
      - ./config.php:/var/www/html/indexer.config.php
