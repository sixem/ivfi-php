services:
  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${SERVEPOINT:?Set SERVEPOINT to the directory to browse}
        target: /srv
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
  php:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: php
    volumes:
      - type: bind
        source: ${SERVEPOINT:?Set SERVEPOINT to the directory to browse}
        target: /srv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config.php
        target: /opt/ivfi/public/indexer.config.php
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
