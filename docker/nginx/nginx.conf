server {
    listen 8080;
    root /opt/ivfi/public;
    index /indexer.php;
    absolute_redirect off;

    # Check both Nginx and PHP-FPM without scanning the media directory.
    location = /.ivfi-health {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
        fastcgi_pass php:9000;
        access_log off;
    }

    # Only the bundled entry point may execute PHP.
    location = /indexer.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ivfi/public/indexer.php;
        fastcgi_param INDEXER_BASE_PATH /srv;
        fastcgi_pass php:9000;
    }

    location ~ (^|/)\. {
        return 404;
    }
    location ~* \.(php[0-9]*|phtml|phar)(/|$) {
        return 404;
    }

    location / {
        try_files $uri @media;
    }
    location @media {
        root /srv;
        # Media links must not expose files elsewhere in the container.
        disable_symlinks on from=/srv;
        try_files $uri $uri/ /indexer.php$is_args$args;
    }
}
